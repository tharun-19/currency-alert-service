server:
  port: 8081

spring:
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:15432/currency_alert_db?options=-c%20TimeZone=UTC
    username: cas_user
    password: cas_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret: change-me-this-is-a-test-secret-key-for-local-dev
  expiration-ms: 3600000